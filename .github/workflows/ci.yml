name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm run build

  # Testes de SQL contra Postgres de verdade (`migrations/*.integration.test.ts`). Só esse diretório:
  # os `*.integration.test.ts` de `routes/` escrevem no HML do Conexos e não podem rodar em CI.
  # Regis-Review 2026-09-14, card `testability-1` (P0): sem este job, as garantias da
  # `vw_metricas_ciclo` (janela, borderô desfeito, alcance do leitor) não rodavam em lugar nenhum.
  backend-sql:
    name: Backend SQL (Postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/backend/package-lock.json
      - run: npm ci
      - run: npm run test:sql
        env:
          METRICAS_CICLO_TEST_DSN: postgres://postgres:test@localhost:5432/postgres

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage

  tag-release:
    name: Tag Release
    needs: [backend, backend-sql, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag + GitHub Release from package.json version (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # App version is FE+BE lockstep; read from frontend package.json.
          VERSION=$(node -p "require('./src/frontend/package.json').version")
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — nothing to release (no version bump in this push)."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "See CHANGELOG.md for details." || \
            echo "::warning::Release creation failed (tag pushed); continuing."
