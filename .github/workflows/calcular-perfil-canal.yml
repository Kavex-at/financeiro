name: Perfil de canal dos favorecidos (SISPAG)

# ADR-0063, I13i — `calcularPerfilCanal`: por qual canal (boleto, TED/PIX, outros) cada favorecido
# costuma ser pago, casando a baixa a pagar (fin010) com o débito do extrato (fin095). O resultado
# (`perfil_canal_fornecedor`) alimenta o alerta de "canal habitual" da verificação TED/PIX.
#
# READ-ONLY no ERP: só leituras (`/list`). Grava só no nosso Postgres, numa transação. Rodada com
# alguma leitura falha NÃO grava (os perfis anteriores valem) e sai com exit ≠ 0; rodada que não
# produz perfil nenhum também sai com exit ≠ 0 — "zero" aqui é leitura vazia, não resultado.
#
# Cadência: semanal, domingo 06:17 UTC (03:17 BRT). O perfil muda devagar; a varredura de borderôs
# é cara e fora do expediente não disputa sessão com a analista.
#
# ⚠️ Credenciais: usa os MESMOS secrets CONEXOS_* dos outros crons. Em 23/09 eles estavam
# desatualizados (Bad Credentials) e a ingestão fechou "success" com 0 títulos.
#
# ⚠️ Sessões: o Conexos limita sessões simultâneas por usuário (`LOGIN_ERROR_MAX_SESSIONS`) e todos
# os crons usam o MESMO usuário. Minutos já ocupados por jobs que leem o ERP: :00 (permutas),
# :10/:25/:40/:55 (reaper), :20 (extratos), :35 (reconciliar-nde) e :48 (sincronização, dias
# úteis). O :17 de domingo cai longe de todos.
#
# ⚠️ Schedules do GitHub Actions só disparam a partir do BRANCH PADRÃO (main). Antes de ligar a
# verificação, rode uma vez pelo "Run workflow" manual (passo de rollout da ADR-0063).
on:
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch: {}

concurrency:
  group: calcular-perfil-canal
  cancel-in-progress: false

jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/backend
    env:
      # Nomes EXATOS lidos pelo EnvironmentProvider/Conexos (iguais aos de ingest-sispag.yml).
      databaseConnectionString: ${{ secrets.DATABASE_CONNECTION_STRING }}
      CONEXOS_BASE_URL: ${{ secrets.CONEXOS_BASE_URL }}
      CONEXOS_USERNAME: ${{ secrets.CONEXOS_USERNAME }}
      CONEXOS_PASSWORD: ${{ secrets.CONEXOS_PASSWORD }}
      CONEXOS_FIL_COD: ${{ vars.CONEXOS_FIL_COD }}
      environment: production
      client_name: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências (com devDeps p/ tsx)
        run: npm ci --include=dev
      - name: Aplicar migrations pendentes (idempotente)
        run: npm run migrate
      - name: Calcular perfil de canal (read-only no ERP)
        run: npm run job:perfil-canal

      # ⚠️ Passo de ALERTA — ADR-0042. Roda SÓ quando algo acima falhou (inclusive o exit 1 de
      # leitura falha ou zero perfis). `continue-on-error` + exit 0 no script: não mascara nem
      # duplica a falha do workflow.
      - name: Alertar falha (ADR-0042)
        if: failure()
        continue-on-error: true
        env:
          databaseConnectionString: ${{ secrets.DATABASE_CONNECTION_STRING }}
          PIPELINE_ALVO: sispag-perfil-canal
          WORKFLOW_NOME: Perfil de canal dos favorecidos (SISPAG)
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          environment: production
          client_name: local
        run: npm run job:alerta-workflow-falhou
