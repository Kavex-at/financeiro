name: Ingestão diária de SISPAG

# Cron GRATUITO via GitHub Actions (Render Cron Job é pago). Roda a ingestão da
# carteira de pagamentos e, EM SEGUIDA, a formação automática de lotes (a ordem
# importa: formar-lotes consome o que a ingestão gravou).
#
# Horários (v0.53.0, emenda 2026-10-30 da ADR-0060), FORA da hora cheia: o GitHub atrasa mais os
# schedules do minuto :00 (o das 10:00 UTC saiu ~16:23 UTC e o das 19:00 UTC não disparou nos últimos
# 3 dias úteis medidos). Minutos :07/:13 não colidem com os outros crons (permutas 0 9,15,21; extratos
# :20; reaper :10,:25,:40,:55; nde :35; staleness :45; lotes :48) nem com permutas às 06:00 BRT.
#   05:07 BRT (dia útil) — rede de segurança da manhã: atualiza carteira + DDA antes do expediente.
#   07:07 BRT (todo dia) — principal.
#   12:13 e 16:13 BRT (dia útil).
# A carteira também é atualizada quando alguém abre a tela do SISPAG (TTL de 30 min), então estes são
# a rede de segurança, não a fonte de frescor.
#
# A FORMAÇÃO de lotes é chamada nos slots 05:07, 07:07 e 12:13 (e no disparo manual, com `--manual`).
# Quem decide é o serviço: só em dia útil, nunca antes das 06:30 BRT e no máximo UMA por dia (trilha
# `job_execucao`, pipeline `sispag-formacao-lotes`) — formar várias vezes fragmentaria os lotes. Assim
# um slot da manhã atrasado ou perdido não impede a formação, e dois slots juntos não formam duas vezes.
# Nunca acontece na abertura da tela.
# Os jobs usam o robô (rodam fora de request) — o bloqueio de acesso do SISPAG
# (SISPAG_ENABLED) é só das rotas HTTP e NÃO afeta estes crons.
#
# ⚠️ Schedules do GitHub Actions só disparam a partir do BRANCH PADRÃO (main).
# Enquanto este arquivo não estiver em `main`, use o "Run workflow" manual
# (workflow_dispatch) na aba Actions.
on:
  schedule:
    # 05:07 BRT (= 08:07 UTC), dia útil — rede de segurança (a formação pula: antes das 06:30).
    - cron: '7 8 * * 1-5'
    # 07:07 BRT (= 10:07 UTC), todo dia — principal (formação só se for dia útil).
    - cron: '7 10 * * *'
    # 12:13 BRT (= 15:13 UTC), dia útil — forma se a manhã inteira se perdeu.
    - cron: '13 15 * * 1-5'
    # 16:13 BRT (= 19:13 UTC), dia útil — só ingestão.
    - cron: '13 19 * * 1-5'
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

# Evita duas execuções simultâneas do pipeline SISPAG.
concurrency:
  group: ingest-sispag
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/backend
    env:
      # Nomes EXATOS lidos pelo EnvironmentProvider/Conexos (iguais ao de Permutas).
      databaseConnectionString: ${{ secrets.DATABASE_CONNECTION_STRING }}
      CONEXOS_BASE_URL: ${{ secrets.CONEXOS_BASE_URL }}
      CONEXOS_USERNAME: ${{ secrets.CONEXOS_USERNAME }}
      CONEXOS_PASSWORD: ${{ secrets.CONEXOS_PASSWORD }}
      CONEXOS_FIL_COD: ${{ vars.CONEXOS_FIL_COD }}
      environment: production
      client_name: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências (com devDeps p/ tsx)
        run: npm ci --include=dev
      - name: Aplicar migrations pendentes (idempotente)
        run: npm run migrate
      - name: Ingestão de pagamentos (carteira titulo_a_pagar)
        run: npm run job:ingest-pagamentos
      # Slots 05:07, 07:07 e 12:13 BRT: o serviço decide se forma (dia útil, ≥ 06:30 BRT, uma por
      # dia). `github.event.schedule` traz a expressão cron que disparou (não a hora, que o GitHub
      # atrasa). O disparo manual forma sem trava (`--manual`), como o botão da tela.
      - name: Formação automática de lotes (após a ingestão)
        if: >-
          github.event_name == 'schedule' &&
          (github.event.schedule == '7 8 * * 1-5' ||
           github.event.schedule == '7 10 * * *' ||
           github.event.schedule == '13 15 * * 1-5')
        run: npm run job:formar-lotes
      - name: Formação de lotes (disparo manual, sem trava)
        if: github.event_name == 'workflow_dispatch'
        run: npm run job:formar-lotes -- --manual
      # ADR-0073 (D2): lê o "NÚMERO DA DPS" do PDF da NFS-e no GED só para os títulos cuja sugestão
      # de boleto DDA a ordem de DPS não desempatou. Por último: nunca atrasa nem bloqueia a carteira
      # e a formação; falha geral (nada lido, tudo falhou) cai no passo de alerta abaixo.
      - name: Leitura do DPS no GED (desempate da sugestão de boleto)
        run: npm run job:ler-dps-nfse

      # ⚠️ Passo de ALERTA — ADR-0042. Roda SÓ quando algo acima falhou.
      #
      # Complementa o `detect-staleness`, não o duplica: aquele lê a tabela de runs e enxerga a run
      # que foi aberta e fechada com `error`; ESTE cobre o workflow que morreu antes de existir
      # linha de run — `npm ci` que falhou, migration que não aplicou, runner que evaporou, ou o
      # processo derrubado entre o `createRun` e o `finishRun` (que deixa a linha presa em
      # `running`, e `running` não é `error`). Sem ele, a falha mais bruta seria a invisível.
      #
      # `continue-on-error` + exit 0 no script: o workflow JÁ está falhando, e o passo de alerta não
      # pode mascarar nem duplicar essa falha (I5 no nível do CI). O desfecho do workflow continua
      # sendo o da etapa que quebrou.
      - name: Alertar falha (ADR-0042)
        if: failure()
        continue-on-error: true
        env:
          databaseConnectionString: ${{ secrets.DATABASE_CONNECTION_STRING }}
          PIPELINE_ALVO: sispag-pagamentos
          WORKFLOW_NOME: Ingestão SISPAG
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          environment: production
          client_name: local
        run: npm run job:alerta-workflow-falhou
