# Render Blueprint — Columbia Financeiro backend (Express, src/backend).
# Deploy: Render reads this file from the repo root. Frontend is on Vercel and
# the database on Supabase (see DEPLOY.md). Secret envs use sync:false so they
# are set manually in the Render dashboard (never committed).
services:
  - type: web
    name: financeiro-backend
    runtime: node
    rootDir: src/backend
    plan: starter
    branch: main
    # Native auto-deploy on push to `main`. The gate is GitHub branch protection
    # (CI `Backend`/`Frontend` checks required to merge), so only tested code
    # reaches `main` and gets deployed. DB migrations run at BOOT (see below),
    # before traffic switches; a failed build/migration is not promoted.
    # See .github/workflows/ci.yml (gates only — no deploy job).
    autoDeploy: true
    # `npm run build` = tsc + copia `migrations/*.sql` para `dist/migrations/`
    # (`migrations/copy-to-dist.ts`). Sem a cópia o BootMigrator não acha migração nenhuma —
    # foi assim até a v0.40.0 (ver DEPLOY.md, incidente 2026-09-23).
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # SEM preDeployCommand — deliberado, não esquecimento.
    #
    # A linha `preDeployCommand: npm run migrate && npm run seed:admin` viveu aqui até a v0.34.1 e
    # NUNCA executou: pre-deploy é feature de plano pago e este serviço foi criado pelo dashboard.
    # Quem migra é o `BootMigrator`, chamado por `src/backend/index.ts` antes do `app.listen` (ver
    # `src/backend/http/bootstrap.ts`) — o servidor é inalcançável enquanto houver migração
    # pendente, e falhar ao migrar mata o processo com código 1, mantendo a versão anterior no ar.
    #
    # Removida porque duas fontes discordando é como se perde a de verdade: o próximo dev que
    # "limpasse" o boot poderia remover o `BootMigrator` acreditando que o Render cobria.
    # (Regis-Review 2026-09-03, card `deployability-3`.)
    healthCheckPath: /health
    envVars:
      # Non-secret, fixed defaults.
      - key: environment
        value: production
      - key: client_name
        value: local
      - key: DEV_AUTH_BYPASS
        value: 'false'
      # Frente II (SISPAG) liberada em produção (v0.17.4). Painel/ingestão/formação/revisão
      # navegáveis; geração de remessa (fin015) e retorno (fin052) seguem dormentes/gated.
      - key: SISPAG_ENABLED
        value: 'true'
      # KILL-SWITCH da ESCRITA do SISPAG (fin015 remessa + fin052 conciliacao), separado do
      # `SISPAG_ENABLED` (que decide se a TELA existe) e do `CONEXOS_DRY_RUN` (que e GLOBAL e
      # levaria Permutas e Recebimentos junto). Default do codigo e `false`: enquanto a
      # Columbia nao validar a remessa ponta a ponta, a tela navega e simula, mas NAO escreve.
      # `sync: false` deixa o dashboard como fonte da verdade — ligar e desligar sem redeploy.
      - key: SISPAG_LIVE_WRITE_ENABLED
        sync: false
      # SISPAG TED/PIX (ADR-0054) — gates de go-live, default do codigo `false` (so `'true'` exato
      # liga). Desligadas, a remessa e a tela sao identicas as de antes. Ligar NESTA ORDEM, uma por
      # vez, durante o teste supervisionado (ontology/_inbox/sispag-ted-pix-tasks.md):
      #   1. SISPAG_TED_ENABLED            — TED como modalidade 5, conta do cadastro em qualquer banco
      #   2. SISPAG_DESTINO_MANUAL_ENABLED — destino digitado no item (conta; chave so com o PIX)
      #   3. SISPAG_PIX_ENABLED            — PIX por chave (cmnPessoasPix ou digitada)
      # Desligar no meio de uma retomada de remessa FALHA FECHADO (destino fixado), nao troca conta.
      # `sync: false`: o dashboard e a fonte da verdade; liga e desliga sem redeploy.
      - key: SISPAG_TED_ENABLED
        sync: false
      - key: SISPAG_DESTINO_MANUAL_ENABLED
        sync: false
      - key: SISPAG_PIX_ENABLED
        sync: false
      # Frente IV (Recebimentos / "Gestão de Adiantamentos") LIBERADA em produção (v0.20.0, ADR-0028).
      # NÃO é mais fail-safe: ausência da env = HABILITADO. Isto virou o KILL-SWITCH de emergência —
      # setar `false` no dashboard derruba `/recebimentos/*` para 403 SEM redeploy.
      # `sync: false` mantém o dashboard como fonte da verdade (o blueprint não sobrescreve).
      - key: RECEBIMENTOS_ENABLED
        sync: false
      # Frente IV — PISO da janela de ingestão do extrato (`YYYY-MM-DD`). Nenhuma sincronização lê
      # lançamento anterior a esta data, nem o backfill manual. O código já tem o mesmo default;
      # declarado aqui para o operador enxergar o marco de go-live. Ver ADR-0028.
      - key: CONEXOS_EXTRATO_SYNC_START_DATE
        value: '2026-08-03'
      # Fase 3 (ADR-0013) — ESCRITA no fin010. FONTE ÚNICA = dashboard do Render (sync:false), para
      # NÃO ter o blueprint sobrescrevendo o dashboard a cada deploy (Regis P0 deployability — yaml
      # brigando com dashboard). Produção hoje: WRITE_ENABLED=true, DRY_RUN=false, BASE_URL=prd.
      # Runbook: docs/runbooks/fin010-write-cutover.md.
      - key: CONEXOS_BASE_URL
        sync: false
      - key: CONEXOS_WRITE_ENABLED
        sync: false
      - key: CONEXOS_DRY_RUN
        sync: false
      # Secrets / per-deploy values — set in the Render dashboard.
      - key: databaseConnectionString
        sync: false
      # Assina o token próprio (modo local). Apagar no passo 8 do corte do Supabase Auth (DEPLOY.md §6).
      - key: AUTH_JWT_SECRET
        sync: false
      # Supabase Auth (ADR-0057): `local` até o passo 5 do corte; `supabase` depois. Rollback = `local`.
      - key: AUTH_PROVIDER
        value: local
      # Só a partir do passo 2 do corte (DEPLOY.md §6): com o backend anterior a esta feature (<= v0.46) no ar, SUPABASE_URL
      # desloga todo mundo (D14).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Poder de admin sobre todos os logins: só aqui e nos jobs manuais; nunca no Vercel.
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Obrigatórias para o `npm run seed:admin` (sem default no código, ADR-0051).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CONEXOS_USERNAME
        sync: false
      - key: CONEXOS_PASSWORD
        sync: false
      - key: CONEXOS_FIL_COD
        sync: false
