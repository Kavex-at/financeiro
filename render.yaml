# Render Blueprint — Columbia Financeiro backend (Express, src/backend).
# Deploy: Render reads this file from the repo root. Frontend is on Vercel and
# the database on Supabase (see DEPLOY.md). Secret envs use sync:false so they
# are set manually in the Render dashboard (never committed).
services:
  - type: web
    name: financeiro-backend
    runtime: node
    rootDir: src/backend
    plan: starter
    branch: main
    # Native auto-deploy on push to `main`. The gate is GitHub branch protection
    # (CI `Backend`/`Frontend` checks required to merge), so only tested code
    # reaches `main` and gets deployed. `preDeployCommand` below runs the DB
    # migrations before traffic switches; a failed build/migration is not
    # promoted. See .github/workflows/ci.yml (gates only — no deploy job).
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Runs migrations + admin seed before serving traffic on each deploy.
    preDeployCommand: npm run migrate && npm run seed:admin
    healthCheckPath: /health
    envVars:
      # Non-secret, fixed defaults.
      - key: environment
        value: production
      - key: client_name
        value: local
      - key: DEV_AUTH_BYPASS
        value: 'false'
      # Frente II (SISPAG) liberada em produção (v0.17.4). Painel/ingestão/formação/revisão
      # navegáveis; geração de remessa (fin015) e retorno (fin052) seguem dormentes/gated.
      - key: SISPAG_ENABLED
        value: 'true'
      # KILL-SWITCH da ESCRITA do SISPAG (fin015 remessa + fin052 conciliacao), separado do
      # `SISPAG_ENABLED` (que decide se a TELA existe) e do `CONEXOS_DRY_RUN` (que e GLOBAL e
      # levaria Permutas e Recebimentos junto). Default do codigo e `false`: enquanto a
      # Columbia nao validar a remessa ponta a ponta, a tela navega e simula, mas NAO escreve.
      # `sync: false` deixa o dashboard como fonte da verdade — ligar e desligar sem redeploy.
      - key: SISPAG_LIVE_WRITE_ENABLED
        sync: false
      # Frente IV (Recebimentos / "Gestão de Adiantamentos") LIBERADA em produção (v0.20.0, ADR-0028).
      # NÃO é mais fail-safe: ausência da env = HABILITADO. Isto virou o KILL-SWITCH de emergência —
      # setar `false` no dashboard derruba `/recebimentos/*` para 403 SEM redeploy.
      # `sync: false` mantém o dashboard como fonte da verdade (o blueprint não sobrescreve).
      - key: RECEBIMENTOS_ENABLED
        sync: false
      # Frente IV — PISO da janela de ingestão do extrato (`YYYY-MM-DD`). Nenhuma sincronização lê
      # lançamento anterior a esta data, nem o backfill manual. O código já tem o mesmo default;
      # declarado aqui para o operador enxergar o marco de go-live. Ver ADR-0028.
      - key: CONEXOS_EXTRATO_SYNC_START_DATE
        value: '2026-08-03'
      # Fase 3 (ADR-0013) — ESCRITA no fin010. FONTE ÚNICA = dashboard do Render (sync:false), para
      # NÃO ter o blueprint sobrescrevendo o dashboard a cada deploy (Regis P0 deployability — yaml
      # brigando com dashboard). Produção hoje: WRITE_ENABLED=true, DRY_RUN=false, BASE_URL=prd.
      # Runbook: docs/runbooks/fin010-write-cutover.md.
      - key: CONEXOS_BASE_URL
        sync: false
      - key: CONEXOS_WRITE_ENABLED
        sync: false
      - key: CONEXOS_DRY_RUN
        sync: false
      # Secrets / per-deploy values — set in the Render dashboard.
      - key: databaseConnectionString
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CONEXOS_USERNAME
        sync: false
      - key: CONEXOS_PASSWORD
        sync: false
      - key: CONEXOS_FIL_COD
        sync: false

  # ── Cron: ingestão diária de Permutas ──────────────────────────────────────
  # `jobs/ingest-permutas.ts` existe desde o bootstrap com o crontab `0 6 * * *`
  # DOCUMENTADO no header do arquivo e nunca configurado em lugar nenhum — o
  # blueprint só declarava o serviço web. Efeito: a tabela `permuta_invoice` só
  # era recalculada quando um analista clicava em "Ingerir", e o `IngestLockBusyError`
  # falava de "cron ou outro analista" sobre um cron que não existia.
  #
  # Isso importa para o bug `invoice-pago-detalhe`: o `pago` corrigido é um retrato
  # do momento da ingestão. Sem cadência automática, uma invoice liquidada DEPOIS da
  # última ingestão continua aparecendo como "em aberto" — o sintoma que a Simone
  # relatou sobreviveria parcialmente à correção do código.
  #
  # O job é READ-ONLY no Conexos (a única escrita é o banco próprio) e é protegido
  # por advisory lock, então concorrer com um clique manual é seguro: o perdedor sai
  # sem fazer nada (`IngestLockBusyError`).
  #
  # ⚠️ `schedule` do Render é UTC. `0 9 * * *` UTC = 06:00 em America/Sao_Paulo
  # (UTC-3), que é o horário documentado no header do job.
  - type: cron
    name: financeiro-ingest-permutas
    runtime: node
    rootDir: src/backend
    plan: starter
    branch: main
    schedule: '0 9 * * *'
    buildCommand: npm ci && npm run build
    startCommand: npm run job:ingest-permutas
    envVars:
      # Espelha o serviço web — divergência de env entre a API e o job produz
      # ingestão com regra diferente da tela, que é pior que não ter cron.
      - key: environment
        value: production
      - key: client_name
        value: local
      - key: CONEXOS_EXTRATO_SYNC_START_DATE
        value: '2026-08-03'
      # Fonte da verdade = dashboard do Render (mesma política do serviço web).
      - key: CONEXOS_BASE_URL
        sync: false
      # O job não escreve no ERP; as flags acompanham o web só para não haver
      # dois comportamentos diferentes se algum caminho novo passar por aqui.
      - key: CONEXOS_WRITE_ENABLED
        sync: false
      - key: CONEXOS_DRY_RUN
        sync: false
      - key: databaseConnectionString
        sync: false
      - key: CONEXOS_USERNAME
        sync: false
      - key: CONEXOS_PASSWORD
        sync: false
      - key: CONEXOS_FIL_COD
        sync: false
